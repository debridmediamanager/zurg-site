name: installer
on:
  push:
    paths:
      - 'public/install.ps1'
      - 'public/install.sh'
      - 'public/install-docker.sh'
      - 'tests/**'
      - '.github/workflows/installer.yml'
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Installer.ps1
      - name: PowerShell 7
        shell: pwsh
        run: .\tests\Test-Installer.ps1

  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Shell installers
        run: bash tests/test-install-sh.sh
      - name: Shell installers under the system bash
        if: runner.os == 'macOS'
        run: /bin/bash tests/test-install-sh.sh
